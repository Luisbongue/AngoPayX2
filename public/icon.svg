<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#091e1d"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="110" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Geometric Symbol 'A' + Exchange Arrows -->
  <g filter="url(#glow)">
    <!-- Base stylized letter A -->
    <path d="M256 96 L376 380 L310 380 L286 322 L226 322 L202 380 L136 380 Z M256 182 L238 274 L274 274 Z" fill="url(#primaryGrad)"/>
    
    <!-- Dynamic Exchange Curved Indicator -->
    <path d="M340 160 C385 190 410 240 400 300" fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round"/>
    <polygon points="410,315 418,280 385,295" fill="#a855f7"/>

    <path d="M172 352 C127 322 102 272 112 212" fill="none" stroke="url(#primaryGrad)" stroke-width="20" stroke-linecap="round"/>
    <polygon points="102,197 94,232 127,217" fill="#34d399"/>
  </g>

  <!-- Bottom Brand Badge -->
  <g transform="translate(186, 412)">
    <rect width="140" height="34" rx="17" fill="#0f172a" stroke="#10b981" stroke-width="2" stroke-opacity="0.6"/>
    <text x="70" y="23" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="2">ANGOPAYX</text>
  </g>
</svg>
